version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '05:00'
      timezone: Europe/London
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: nuget
    directories:
      - /src/OBP.Godot
      - /tests/OBP.Tests
    schedule:
      interval: weekly
      day: monday
      time: '05:15'
      timezone: Europe/London
    groups:
      nuget:
        patterns: ['*']
