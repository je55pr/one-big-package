name: CodeQL

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  schedule:
    - cron: '23 4 * * 1'

# A fresh PR commit supersedes the old scan, but push/scheduled scans stay
# independent. Do not accidentally cancel CodeQL with the native CI workflow.
concurrency:
  group: codeql-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the token is read-only by default; only the analyze job
# may upload results.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C#
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:csharp
