name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore OneBigPackage.sln
      - name: Build
        run: dotnet build OneBigPackage.sln -c Release --no-restore --nologo -warnaserror
