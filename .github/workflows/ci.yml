name: CI

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore OneBigPackage.sln
      - name: Verify formatting
        run: dotnet format OneBigPackage.sln --verify-no-changes --no-restore --verbosity minimal
      - name: Build
        run: dotnet build OneBigPackage.sln -c Release --no-restore --nologo -warnaserror
