name: CI

on:
  pull_request:
  push:
    branches: [dev]

# A new revision makes prior runs for this PR obsolete. Keep push and
# pull_request groups separate, and do not cancel trusted dev runs.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore OneBigPackage.sln
      - run: dotnet format OneBigPackage.sln --verify-no-changes --no-restore --verbosity minimal
      - run: dotnet build OneBigPackage.sln -c Release --no-restore --nologo -warnaserror
      - name: Portable tests and validated managed coverage
        shell: pwsh
        run: ./tools/test-coverage.ps1 -Configuration Release -NoBuild
      - name: Publish safe coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-coverage
          path: .build/coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Measure root ownership boundaries
        run: |
          dotnet run --project tools/OBP.ArchitectureTool -c Release --no-build -- census . > .build/root-census.json
      - name: Publish root ownership census
        uses: actions/upload-artifact@v7
        with:
          name: root-ownership-census
          path: .build/root-census.json
          if-no-files-found: error
          retention-days: 14

  godot-smoke:
    name: godot-smoke
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Install checksum-pinned Godot .NET
        run: bash tools/bootstrap-godot.sh
      - name: Build Godot C# host
        run: dotnet build game/OBP.Game.csproj -c Debug --nologo -warnaserror
      - name: Import project resources headlessly
        run: .tools/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 --headless --path game --editor --import --quit
      - name: Smoke-test the asset-free Game Sources startup
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/obp-godot-data
          XDG_CONFIG_HOME: ${{ runner.temp }}/obp-godot-config
          XDG_CACHE_HOME: ${{ runner.temp }}/obp-godot-cache
        run: |
          .tools/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 \
            --headless --path game --script res://tests/ci_bootstrap_smoke.gd \
            -- --test-scene picker
      - name: Smoke-test ambient UV-scroll group binding
        run: |
          .tools/godot/Godot_v4.7.2-stable_mono_linux_x86_64/Godot_v4.7.2-stable_mono_linux.x86_64 \
            --headless --path game --script res://tests/ambient_uv_scroll_smoke.gd
