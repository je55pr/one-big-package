# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Prefer maximum review coverage: flag even low-severity or stylistic findings.
# The repository's AGENTS.md and architecture contract remain authoritative.
inheritance: true
enable_free_tier: true
language: en-GB

tone_instructions: >-
  Report all credible findings, including minor code quality, naming, style,
  documentation, duplication, performance, maintainability, testing, security,
  resource lifetime, architecture, and correctness concerns. Do not suppress an
  issue merely because dotnet format or another tool covers similar territory.
  Clearly distinguish verified defects from uncertain risks, cite affected code,
  and explain impact and suggestions. Do not invent claims about original retail
  behaviour without evidence. Findings are advisory: developers decide what to fix.

reviews:
  profile: assertive
  high_level_summary: true
  review_status: true
  poem: false
  # Report everything, but do not make review comments mandatory merge blockers.
  request_changes_workflow: false
  commit_status: false
  fail_commit_status: false
  auto_review:
    enabled: true
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
    drafts: true
    # Do not skip draft/WIP work just because it is unfinished.
    ignore_title_keywords: []
  # Review all tracked source, tests, docs and automation; no broad exclusions.
  path_filters:
    - '*'
    - '**/*'
  path_instructions:
    - path: "src/OBP.RAC*/**/*.cs"
      instructions: |
        Preserve source-specific mechanics, formats, IDs and recovered timing.
        Flag bounds, provenance, damage/lifetime and native-state regressions.
        Do not demand identical behaviour across original games without retail evidence.
        New native claims need tests and evidence; do not invent missing mechanics.
    - path: "src/OBP.Runtime/**/*.cs"
      instructions: |
        This is an engine-neutral layer. Flag use of Godot types, source-native
        formulas, gameplay orchestration policy or unqualified cross-game IDs.
        Check validation, ownership, disposal contracts and immutable snapshots.
    - path: "src/OBP.Fusion/**/*.cs"
      instructions: |
        Fusion orchestrates source-qualified actors and equipment, but must not
        implement native controller rules or depend on Godot presentation.
        Destination origin must not determine player identity, movement,
        loadout or UI. Check session lifetime and source capability admission.
    - path: "game/**/*.cs"
      instructions: |
        Review the real Godot C# gameplay host for scene/audio/projectile
        cleanup, single owner of player state, input focus and fixed-tick
        animation correctness. World source selects environment, never avatar,
        weapons, health, pause UI or input profile. Report silent capsule
        fallbacks and source-inconsistent player presentation.
    - path: "src/OBP.Godot/**/*.cs"
      instructions: |
        Check Godot resource ownership, failed-load rollback and frame-loop
        allocations. Keep native formats and gameplay decisions in their
        source modules. Verify teardown works on re-entry and shutdown.
    - path: ".github/workflows/**"
      instructions: |
        Verify bounded GitHub Actions checks, required native/Godot C# builds,
        no retail payloads or secret exposure, and no unnecessary toolchains.
        PR reviews stay advisory; builds/tests remain the hard merge checks.
    - path: "tests/**/*.cs"
      instructions: |
        Prefer deterministic portable regressions with explicit source IDs,
        and retail-backed claims only when real authorised sources were used.
        Cross-game integration cases must not replace native parity tests.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "AGENTS.md"
      - "docs/ARCHITECTURE.md"
      - "docs/PLAYER_WORLD_CONTRACT.md"
